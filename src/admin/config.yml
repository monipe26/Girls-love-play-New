  # ------------------------------------------------------------
  # ACTRICES (src/_data/cms/actrices.json)
  # ------------------------------------------------------------
  - name: actrices
    label: "💖 Actrices"
    files:
      - name: actrices
        label: "Lista de actrices"
        file: src/_data/cms/actrices.json
        media_folder: /src/assets/images/actrices
        public_folder: /assets/images/actrices
        fields:
          - label: "Actrices"
            name: items
            widget: list
            label_singular: "Actriz"
            summary: "{{fields.nombre}} · {{fields.apodo}}"
            add_to_top: true
            fields:
              - { label: "Nombre", name: nombre, widget: string }
              - label: "Slug (dirección interna)"
                name: slug
                widget: string
                hint: "Ejemplo: nombre-apellido-gl-actriz. En las actrices que ya existen NO lo cambies."
              - { label: "Nombre original (en su idioma)", name: nombreOriginal, widget: string, required: false }
              - { label: "Apodo / Ship", name: apodo, widget: string, required: false }
              - { label: "Foto", name: foto, widget: image, choose_url: false, hint: "Subí la foto original, el sitio la achica y la comprime solo." }
              - { label: "Fecha de nacimiento (AAAA-MM-DD)", name: nacimiento, widget: string, required: false, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Formato AAAA-MM-DD. Ejemplo: 1998-04-10"] }
              - { label: "Nacionalidad", name: nacionalidad, widget: string, required: false }
              - { label: "Ship (slug de la pareja)", name: shipSlug, widget: string, required: false }
              - { label: "Instagram (dirección completa)", name: instagram, widget: string, required: false }
              - label: "Series"
                name: series
                widget: list
                required: false
                label_singular: "Serie"
                summary: "{{fields.titulo}} ({{fields.anio}})"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Año", name: anio, widget: string, required: false }
              - { label: "Biografía", name: biografia, widget: text, required: false, hint: "Opcional. Podés dejarla vacía y completarla más adelante. Se muestra en la ficha de la actriz." }

  # ------------------------------------------------------------
  # SERIES (reproductor /series-gl/) (src/_data/cms/series.json)
  # ------------------------------------------------------------
  - name: series
    label: "📺 Series"
    files:
      - name: series
        label: "Lista de series"
        file: src/_data/cms/series.json
        media_folder: /src/assets/images/series
        public_folder: /assets/images/series
        fields:
          - label: "Series"
            name: items
            widget: list
            label_singular: "Serie"
            summary: "{{fields.titulo}} ({{fields.anio}})"
            add_to_top: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Slug (dirección web)"
                name: slug
                widget: string
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones."]
                hint: "⚠️ En las series que ya existen NO lo cambies: cambia la dirección de la página."
              - { label: "Año", name: anio, widget: number, value_type: int }
              - { label: "Género", name: genero, widget: string, hint: "Ejemplo: Romance · Drama" }
              - { label: "Sinopsis", name: sinopsis, widget: text, required: false, hint: "Se muestra en la ficha de la serie y un fragmento en la portada del sitio." }
              - { label: "Portada", name: portada, widget: image, choose_url: false, hint: "Subí la imagen original; el sitio la achica y la comprime solo." }
              - label: "Videos de YouTube (solo ID)"
                name: videos
                widget: list
                required: false
                field: { label: "ID", name: id, widget: string, pattern: ["^[A-Za-z0-9_-]{11}$", "El ID tiene 11 caracteres."] }
              - { label: "Playlist de YouTube (ID)", name: playlist, widget: string, required: false }

  # ------------------------------------------------------------
  # CALENDARIO DE ESTRENOS (src/_data/cms/calendario.json)
  # ------------------------------------------------------------
  - name: calendario
    label: "🗓️ Calendario"
    files:
      - name: calendario
        label: "Estrenos"
        file: src/_data/cms/calendario.json
        media_folder: /src/assets/images/calendario
        public_folder: /assets/images/calendario
        fields:
          - label: "Estrenos"
            name: items
            widget: list
            label_singular: "Estreno"
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            add_to_top: true
            fields:
              - { label: "Nombre de la serie", name: titulo, widget: string }
              - label: "Fecha de estreno"
                name: fecha
                widget: datetime
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                picker_utc: true
                hint: "Elegís el día en el calendario: el día, el mes y el año se completan solos."
              - { label: "Tipo", name: tipo, widget: select, options: ["Serie", "Película", "Especial"], default: "Serie" }
              - { label: "Miniatura (opcional)", name: portada, widget: image, required: false, choose_url: false, hint: "Subí la foto original; el sitio la achica solo." }
              - { label: "Enlace (opcional)", name: url, widget: string, required: false, hint: "Página del sitio adonde lleva. Ejemplo: /series-gl/nombre/" }

  # ------------------------------------------------------------
  # PUBLICIDAD (src/_data/cms/publicidad.json)
  # ------------------------------------------------------------
  - name: publicidad
    label: "📢 Publicidad"
    files:
      - name: publicidad
        label: "Anuncio de la barra lateral (300×250)"
        file: src/_data/cms/publicidad.json
        media_folder: /src/assets/images/publicidad
        public_folder: /assets/images/publicidad
        fields:
          - { label: "Mostrar anuncio", name: activa, widget: boolean, default: true }
          - { label: "Imagen", name: imagen, widget: image, choose_url: false, hint: "Proporción 6:5 (por ejemplo 300×250 o 600×500). El sitio la ajusta solo." }
          - { label: "Texto alternativo", name: alt, widget: string }
          - { label: "Enlace (opcional)", name: enlace, widget: string, required: false }

  # ------------------------------------------------------------
  # PRUEBA DE CONEXIÓN (se quita en el Paso 6)
  # ------------------------------------------------------------
  - name: prueba
    label: "🧪 Prueba de conexión"
    files:
      - name: destacado
        label: "Video destacado (prueba)"
        file: src/_data/destacado.json
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "ID de YouTube", name: youtubeId, widget: string, hint: "Lo que va después de v= en la URL del video" }
