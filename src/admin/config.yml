  # ------------------------------------------------------------
  # ACTRICES (src/_data/cms/actrices.json)
  # ------------------------------------------------------------
  - name: actrices
    label: "💖 Actrices"
    files:
      - name: actrices
        label: "Lista de actrices"
        file: src/_data/cms/actrices.json
        media_folder: /src/assets/images/actrices
        public_folder: /assets/images/actrices
        fields:
          - label: "Actrices"
            name: items
            widget: list
            label_singular: "Actriz"
            summary: "{{fields.nombre}} · {{fields.apodo}}"
            add_to_top: true
            fields:
              - { label: "Nombre", name: nombre, widget: string }
              - label: "Slug (dirección interna)"
                name: slug
                widget: string
                hint: "Ejemplo: nombre-apellido-gl-actriz. En las actrices que ya existen NO lo cambies."
              - { label: "Nombre original (en su idioma)", name: nombreOriginal, widget: string, required: false }
              - { label: "Apodo / Ship", name: apodo, widget: string, required: false }
              - { label: "Foto", name: foto, widget: image, choose_url: false, hint: "Subí la foto original, el sitio la achica y la comprime solo." }
              - { label: "Fecha de nacimiento (AAAA-MM-DD)", name: nacimiento, widget: string, required: false, pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Formato AAAA-MM-DD. Ejemplo: 1998-04-10"] }
              - { label: "Nacionalidad", name: nacionalidad, widget: string, required: false }
              - { label: "Ship (slug de la pareja)", name: shipSlug, widget: string, required: false }
              - { label: "Instagram (dirección completa)", name: instagram, widget: string, required: false }
              - label: "Series"
                name: series
                widget: list
                required: false
                label_singular: "Serie"
                summary: "{{fields.titulo}} ({{fields.anio}})"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Año", name: anio, widget: string, required: false }
              - { label: "Biografía", name: biografia, widget: text, required: false, hint: "Opcional. Podés dejarla vacía y completarla más adelante. Se muestra en la ficha de la actriz." }

  # ------------------------------------------------------------
  # SERIES (reproductor /series-gl/) (src/_data/cms/series.json)
  # ------------------------------------------------------------
  - name: series
    label: "📺 Series"
    files:
      - name: series
        label: "Lista de series"
        file: src/_data/cms/series.json
        media_folder: /src/assets/images/series
        public_folder: /assets/images/series
        fields:
          - label: "Series"
            name: items
            widget: list
            label_singular: "Serie"
            summary: "{{fields.titulo}} ({{fields.anio}})"
            add_to_top: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Slug (dirección web)"
                name: slug
                widget: string
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones."]
                hint: "⚠️ En las series que ya existen NO lo cambies: cambia la dirección de la página."
              - { label: "Año", name: anio, widget: number, value_type: int }
              - { label: "Género", name: genero, widget: string, hint: "Ejemplo: Romance · Drama" }
              - { label: "Sinopsis", name: sinopsis, widget: text, required: false, hint: "Se muestra en la ficha de la serie y un fragmento en la portada del sitio." }
              - { label: "Portada", name: portada, widget: image, choose_url: false, hint: "Subí la imagen original; el sitio la achica y la comprime solo." }
              - label: "Videos de YouTube (solo ID)"
                name: videos
                widget: list
                required: false
                field: { label: "ID", name: id, widget: string, pattern: ["^[A-Za-z0-9_-]{11}$", "El ID tiene 11 caracteres."] }
              - { label: "Playlist de YouTube (ID)", name: playlist, widget: string, required: false }

  # ------------------------------------------------------------
  # CALENDARIO DE ESTRENOS (src/_data/cms/calendario.json)
  # ------------------------------------------------------------
  - name: calendario
    label: "🗓️ Calendario"
    files:
      - name: calendario
        label: "Estrenos"
        file: src/_data/cms/calendario.json
        media_folder: /src/assets/images/calendario
        public_folder: /assets/images/calendario
        fields:
          - label: "Estrenos"
            name: items
            widget: list
            label_singular: "Estreno"
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            add_to_top: true
            fields:
              - { label: "Nombre de la serie", name: titulo, widget: string }
              - label: "Fecha de estreno"
                name: fecha
                widget: datetime
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                picker_utc: true
                hint: "Elegís el día en el calendario: el día, el mes y el año se completan solos."
              - { label: "Tipo", name: tipo, widget: select, options: ["Serie", "Película", "Especial"], default: "Serie" }
              - { label: "Miniatura (opcional)", name: portada, widget: image, required: false, choose_url: false, hint: "Subí la foto original; el sitio la achica solo." }
              - { label: "Enlace (opcional)", name: url, widget: string, required: false, hint: "Página del sitio adonde lleva. Ejemplo: /series-gl/nombre/" }

  # ------------------------------------------------------------
  # PUBLICIDAD (src/_data/cms/publicidad.json)
  # ------------------------------------------------------------
  - name: publicidad
    label: "📢 Publicidad"
    files:
      - name: publicidad
        label: "Anuncio de la barra lateral (300×250)"
        file: src/_data/cms/publicidad.json
        media_folder: /src/assets/images/publicidad
        public_folder: /assets/images/publicidad
        fields:
          - { label: "Mostrar anuncio", name: activa, widget: boolean, default: true }
          - { label: "Imagen", name: imagen, widget: image, choose_url: false, hint: "Proporción 6:5 (por ejemplo 300×250 o 600×500). El sitio la ajusta solo." }
          - { label: "Texto alternativo", name: alt, widget: string }
          - { label: "Enlace (opcional)", name: enlace, widget: string, required: false }

  # ------------------------------------------------------------
  # BANNER, EXTRAS, PRÓXIMAMENTE, OST, COMUNIDAD Y SHIPS
  # (todos con slug y campos de SEO)
  # ------------------------------------------------------------
  - name: banner-inicio
    label: "🖼️ Banner del inicio"
    files:
      - name: banner-inicio
        label: "Banner del carrusel del inicio (primer slide)"
        file: src/_data/cms/bannerInicio.json
        media_folder: /src/assets/images
        public_folder: /assets/images
        fields:
          - { label: "Mostrar banner", name: activa, widget: boolean, default: true }
          - { label: "Imagen", name: imagen, widget: image, choose_url: false, hint: "Proporción 3:1 (ideal 1600×533 o más). Se ve entera en celular y en escritorio." }
          - { label: "Texto alternativo", name: alt, widget: string, hint: "Describí lo que dice el banner. Ejemplo: Unite a nuestra comunidad en Telegram." }
          - { label: "Enlace al hacer clic", name: enlace, widget: string, required: false, hint: "Dirección completa (https://...) o interna (/comunidad/). Ejemplo: https://t.me/girlsloveplay" }

  - name: extras
    label: "✨ Extras"
    files:
      - name: extras
        label: "Lista de Extras"
        file: src/_data/cms/extras.json
        media_folder: /src/assets/images/videos
        public_folder: /assets/images/videos
        fields:
          - label: "Extras"
            name: items
            widget: list
            label_singular: "Video extra"
            summary: "{{fields.titulo}} · {{fields.youtubeId}}"
            add_to_top: true
            fields:
              - { label: "ID del video de YouTube", name: youtubeId, widget: string, pattern: ["^[A-Za-z0-9_-]{11}$", "El ID tiene 11 caracteres. Pegá solo el ID, no la dirección completa."], hint: "Es lo que va después de v= en la dirección del video. Ejemplo: dQw4w9WgXcQ." }
              - { label: "Título (opcional)", name: titulo, widget: string, required: false, hint: "Dejalo VACÍO y el sitio toma solo el nombre del video desde YouTube. Completalo solo si querés un título distinto." }
              - label: "Slug (dirección web)"
                name: slug
                widget: string
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones. Sin espacios, tildes ni ñ."]
                hint: "Ejemplo: entrevista-lina-mew → girlsloveplay.com/extra/entrevista-lina-mew/. ⚠️ Si lo cambiás en un video ya publicado, cambia su dirección web: avisame para agregar la redirección."
              - { label: "Descripción propia (recomendado para SEO)", name: descripcion, widget: text, required: false, hint: "Un texto tuyo sobre el video (2 o 3 renglones o más). Es lo que hace que su página pueda aparecer en Google: sin texto propio la página existe pero no se indexa." }
              - { label: "Canal (opcional)", name: canal, widget: string, required: false, hint: "Dejalo vacío: se toma solo de YouTube." }
              - { label: "Título para Google (SEO)", name: seoTitle, widget: string, required: false, hint: "Opcional. Es el título azul de Google. Si lo dejás vacío se usa el título del video + el nombre del sitio." }
              - { label: "Descripción para Google (SEO)", name: seoDescription, widget: text, required: false, hint: "Opcional. 120 a 155 caracteres. Si la dejás vacía se usa el comienzo del texto de la página." }
              - { label: "Imagen para compartir en redes", name: ogImage, widget: image, required: false, choose_url: false, hint: "Opcional. Ideal 1200×630. Si la dejás vacía se usa la miniatura del video de YouTube." }
              - { label: "No mostrar en Google (noindex)", name: noindex, widget: boolean, required: false, default: false, hint: "Dejalo apagado salvo casos especiales. Igual, la página del video solo aparece en Google si tiene un texto propio de 80 caracteres o más." }

  - name: proximamente
    label: "🎬 Próximamente"
    files:
      - name: proximamente
        label: "Lista de Próximamente"
        file: src/_data/cms/proximamente.json
        media_folder: /src/assets/images/videos
        public_folder: /assets/images/videos
        fields:
          - label: "Próximamente"
            name: items
            widget: list
            label_singular: "Tráiler"
            summary: "{{fields.titulo}} · {{fields.youtubeId}}"
            add_to_top: true
            fields:
              - { label: "ID del video de YouTube", name: youtubeId, widget: string, pattern: ["^[A-Za-z0-9_-]{11}$", "El ID tiene 11 caracteres. Pegá solo el ID, no la dirección completa."], hint: "Es lo que va después de v= en la dirección del video. Ejemplo: dQw4w9WgXcQ." }
              - { label: "Título (opcional)", name: titulo, widget: string, required: false, hint: "Dejalo VACÍO y el sitio toma solo el nombre del video desde YouTube. Completalo solo si querés un título distinto." }
              - label: "Slug (dirección web)"
                name: slug
                widget: string
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones. Sin espacios, tildes ni ñ."]
                hint: "Ejemplo: love-on-hire-teaser → girlsloveplay.com/proximamente/love-on-hire-teaser/. ⚠️ Si lo cambiás en un video ya publicado, cambia su dirección web: avisame para agregar la redirección."
              - { label: "Sinopsis", name: sinopsis, widget: text, required: false, hint: "De qué trata la serie. Se muestra debajo del reproductor y en la página del tráiler." }
              - { label: "Año de lanzamiento", name: anio, widget: number, value_type: int, required: false, min: 2000, max: 2100 }
